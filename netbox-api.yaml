
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: netbox-rest-api
  description: API REST de NetBox para consultar el inventario
spec:
  type: openapi
  lifecycle: experimental
  owner: user:default/silviotufi
  definition: |
    openapi: 3.0.3
    info:
      title: NetBox REST API
      version: 1.0.0
    servers:
      - url: http://localhost:8000/api
    paths:
      /dcim/devices/:
        get:
          summary: Consultar dispositivos
          responses:
            '200':
              description: Respuesta correcta
      /virtualization/virtual-machines/:
        get:
          summary: Consultar máquinas virtuales
          responses:
            '200':
              description: Respuesta correcta
